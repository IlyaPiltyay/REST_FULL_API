version: '3.8'

services:
  web:
    build: .
    command: >
      bash -c "python manage.py migrate &&
                python manage.py collectstatic --noinput &&
                poetry run python manage.py runserver 0.0.0.0:8000"
    env_file:
      - .env
    volumes:
      - .:/app  # Связываем локальную папку с /app в контейнере
    ports:
      - "8080:8000"  # Проброс приложения на порт 8080
    depends_on:
      - db
      - redis
    working_dir: /app

  db:
    image: postgres:latest
    env_file:
      - .env
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:latest
    ports:
      - "6379:6379"

  celery:
    build: .
    command: poetry run celery -A myproject.config worker --loglevel=info
    env_file:
      - .env
    volumes:
      - .:/app
    depends_on:
      - db
      - redis
    working_dir: /app

  celery_beat:
    build: .
    command: poetry run celery -A myproject.config beat --loglevel=info
    env_file:
      - .env
    volumes:
      - .:/app
    depends_on:
      - redis
    working_dir: /app

volumes:
  postgres_data: {}